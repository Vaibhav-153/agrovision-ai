name: Sync to Hugging Face Space

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check synchronization configuration
        id: config
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: ${{ vars.HF_SPACE_ID }}
        run: |
          if [ -n "$HF_TOKEN" ] && [ -n "$HF_SPACE_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Skipping sync: configure HF_TOKEN and HF_SPACE_ID to enable it."
          fi

      - uses: actions/checkout@v4
        if: steps.config.outputs.enabled == 'true'
        with:
          fetch-depth: 0

      - name: Push repository to Space
        if: steps.config.outputs.enabled == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: ${{ vars.HF_SPACE_ID }}
        run: |
          git remote add space "https://oauth2:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE_ID}"
          git push --force space HEAD:main
