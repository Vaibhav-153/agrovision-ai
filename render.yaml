services:
  - type: web
    name: agrovision-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: APP_NAME
        value: AgroVision AI
      - key: APP_VERSION
        value: 1.1.0
      - key: LOG_LEVEL
        value: INFO
      - key: ROBOFLOW_API_URL
        value: https://serverless.roboflow.com
      - key: ROBOFLOW_MODEL_ID
        value: vaibhav-admane/crop-or-weed-detection-jnmzz-1-yolo11n-t1
      - key: ROBOFLOW_API_KEY
        sync: false
      - key: ROBOFLOW_CLASS_MAP
        value: '{"0":"crop","1":"weed"}'
      - key: MODEL_CONFIDENCE
        value: '0.50'
      - key: MODEL_IOU
        value: '0.50'
      - key: MAX_DETECTIONS
        value: '100'
      - key: MAX_UPLOAD_MB
        value: '10'
      - key: MAX_IMAGE_PIXELS
        value: '25000000'
      - key: MAX_IMAGE_SIDE
        value: '8000'
      - key: RATE_LIMIT_REQUESTS
        value: '30'
      - key: RATE_LIMIT_WINDOW_SECONDS
        value: '60'
