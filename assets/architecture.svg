<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-labelledby="title desc">
  <title id="title">AgroVision AI architecture</title>
  <desc id="desc">Image upload flows through validation, Roboflow inference, and result rendering.</desc>
  <rect width="1200" height="220" fill="#f4f7f5"/>
  <g font-family="Arial, sans-serif" font-size="18" text-anchor="middle">
    <g fill="#ffffff" stroke="#cfded5" stroke-width="2">
      <rect x="30" y="65" width="190" height="90" rx="14"/>
      <rect x="270" y="65" width="190" height="90" rx="14"/>
      <rect x="510" y="65" width="190" height="90" rx="14"/>
      <rect x="750" y="65" width="190" height="90" rx="14"/>
      <rect x="990" y="65" width="180" height="90" rx="14"/>
    </g>
    <g fill="#173126">
      <text x="125" y="104">Gradio</text><text x="125" y="130">image input</text>
      <text x="365" y="104">Validation</text><text x="365" y="130">and cleanup</text>
      <text x="605" y="104">Roboflow</text><text x="605" y="130">Serverless API</text>
