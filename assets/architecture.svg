      <text x="1080" y="104">Boxes, counts,</text><text x="1080" y="130">table and JSON</text>
    </g>
    <g stroke="#258a57" stroke-width="3" fill="none">
      <path d="M220 110 H260"/><path d="M460 110 H500"/><path d="M700 110 H740"/><path d="M940 110 H980"/>
    </g>
    <g fill="#258a57">
      <path d="M260 110 l-10 -6 v12 z"/><path d="M500 110 l-10 -6 v12 z"/>
      <path d="M740 110 l-10 -6 v12 z"/><path d="M980 110 l-10 -6 v12 z"/>
    </g>
  </g>
