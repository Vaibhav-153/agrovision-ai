[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agrovision-ai"
version = "1.1.0"
description = "Render-deployed crop and weed detection app using a Roboflow-hosted YOLO11 Nano model."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Vaibhav Admane" }]
dependencies = [
  "gradio==6.5.1",
  "inference-sdk==1.3.9",
  "Pillow==12.3.0",
  "python-dotenv==1.2.2",
]

[project.optional-dependencies]
dev = ["pytest==9.0.2"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
